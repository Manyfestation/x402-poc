[package]
name = "x402-facilitator"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "=0.7.7"
chrono = { version = "0.4.42", features = ["clock"] }
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa.git", branch = "tn12", package = "kaspa-addresses" }
kaspa-consensus-client = { git = "https://github.com/kaspanet/rusty-kaspa.git", branch = "tn12", package = "kaspa-consensus-client" }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa.git", branch = "tn12", package = "kaspa-consensus-core" }
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa.git", branch = "tn12", package = "kaspa-rpc-core" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa.git", branch = "tn12", package = "kaspa-txscript" }
kaspa-wallet-core = { git = "https://github.com/kaspanet/rusty-kaspa.git", branch = "tn12", package = "kaspa-wallet-core" }
kaspa-wallet-pskt = { git = "https://github.com/kaspanet/rusty-kaspa.git", branch = "tn12", package = "kaspa-wallet-pskt" }
kaspa-wrpc-client = { git = "https://github.com/kaspanet/rusty-kaspa.git", branch = "tn12", package = "kaspa-wrpc-client" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "=1.40.0", features = ["macros", "rt-multi-thread", "time", "net", "sync"] }
